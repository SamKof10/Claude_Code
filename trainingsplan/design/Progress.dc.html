<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: oklch(0.72 0.17 145); text-decoration: none; }
    a:hover { color: oklch(0.80 0.17 145); }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: oklch(0.16 0.008 265); color: oklch(0.97 0.003 265); display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 60px 20px 0 20px;">

    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.5px;">Verlauf</h1>

    <div style="display: flex; gap: 8px;">
      <span style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px; background: oklch(0.97 0.003 265); color: oklch(0.16 0.008 265); font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap;">Kabel-Dips</span>
      <span style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px; background: oklch(0.21 0.010 265); color: oklch(0.80 0.006 265); font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap;">Brustpresse</span>
      <span style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px; background: oklch(0.21 0.010 265); color: oklch(0.80 0.006 265); font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap;">Latzug</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; background: oklch(0.21 0.010 265); border-radius: 16px; padding: 18px 16px 14px 16px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-size: 28px; line-height: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.4px;">27,5</span>
        <span style="font-size: 15px; line-height: 20px; color: oklch(0.70 0.008 265);">kg aktuell</span>
        <span style="margin-left: auto; font-size: 15px; line-height: 20px; font-weight: 600; color: oklch(0.80 0.17 145);">+37,5 %</span>
      </div>

      <svg width="318" height="170" viewBox="0 0 318 170" style="display: block;">
        <rect x="196" y="0" width="41" height="146" fill="oklch(0.72 0.17 65 / 0.10)" rx="4"></rect>
        <line x1="0" y1="146" x2="318" y2="146" stroke="oklch(0.30 0.012 265)" stroke-width="1"></line>
        <line x1="0" y1="98" x2="318" y2="98" stroke="oklch(0.24 0.012 265)" stroke-width="1" stroke-dasharray="3 5"></line>
        <line x1="0" y1="50" x2="318" y2="50" stroke="oklch(0.24 0.012 265)" stroke-width="1" stroke-dasharray="3 5"></line>
        <polyline points="20,128 59,120 98,104 137,88 176,72 216,96 255,56 294,40" fill="none" stroke="oklch(0.72 0.17 145)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
        <circle cx="20" cy="128" r="3.5" fill="oklch(0.16 0.008 265)" stroke="oklch(0.72 0.17 145)" stroke-width="2.5"></circle>
        <circle cx="59" cy="120" r="3.5" fill="oklch(0.16 0.008 265)" stroke="oklch(0.72 0.17 145)" stroke-width="2.5"></circle>
        <circle cx="98" cy="104" r="3.5" fill="oklch(0.16 0.008 265)" stroke="oklch(0.72 0.17 145)" stroke-width="2.5"></circle>
        <circle cx="137" cy="88" r="6" fill="oklch(0.72 0.17 145)"></circle>
        <circle cx="176" cy="72" r="3.5" fill="oklch(0.16 0.008 265)" stroke="oklch(0.40 0.05 145)" stroke-width="2.5"></circle>
        <circle cx="216" cy="96" r="3.5" fill="oklch(0.16 0.008 265)" stroke="oklch(0.72 0.17 65)" stroke-width="2.5"></circle>
        <circle cx="255" cy="56" r="3.5" fill="oklch(0.16 0.008 265)" stroke="oklch(0.40 0.05 145)" stroke-width="2.5"></circle>
        <circle cx="294" cy="40" r="3.5" fill="oklch(0.16 0.008 265)" stroke="oklch(0.40 0.05 145)" stroke-width="2.5"></circle>
        <text x="20" y="164" fill="oklch(0.55 0.010 265)" font-size="11" font-family="-apple-system, system-ui, sans-serif" text-anchor="middle">1</text>
        <text x="98" y="164" fill="oklch(0.55 0.010 265)" font-size="11" font-family="-apple-system, system-ui, sans-serif" text-anchor="middle">3</text>
        <text x="137" y="164" fill="oklch(0.97 0.003 265)" font-size="11" font-weight="600" font-family="-apple-system, system-ui, sans-serif" text-anchor="middle">4</text>
        <text x="216" y="164" fill="oklch(0.80 0.17 65)" font-size="11" font-weight="600" font-family="-apple-system, system-ui, sans-serif" text-anchor="middle">6</text>
        <text x="294" y="164" fill="oklch(0.55 0.010 265)" font-size="11" font-family="-apple-system, system-ui, sans-serif" text-anchor="middle">8</text>
      </svg>

      <div style="display: flex; align-items: center; gap: 16px; padding-top: 2px; border-top: 0.5px solid oklch(0.28 0.012 265); padding-top: 12px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="width: 10px; height: 3px; border-radius: 2px; background: oklch(0.72 0.17 145);"></div>
          <span style="font-size: 12px; line-height: 16px; color: oklch(0.70 0.008 265);">Arbeitsgewicht</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="width: 10px; height: 10px; border-radius: 2px; background: oklch(0.72 0.17 65 / 0.25);"></div>
          <span style="font-size: 12px; line-height: 16px; color: oklch(0.70 0.008 265);">Deload (W6)</span>
        </div>
        <span style="margin-left: auto; font-size: 12px; line-height: 16px; color: oklch(0.55 0.010 265);">Woche</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; background: oklch(0.21 0.010 265); border-radius: 14px; padding: 14px;">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.3px; color: oklch(0.70 0.008 265);">START</span>
        <span style="font-size: 22px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums;">20,0</span>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; background: oklch(0.21 0.010 265); border-radius: 14px; padding: 14px;">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.3px; color: oklch(0.70 0.008 265);">BESTES VOL.</span>
        <span style="font-size: 22px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums;">1 320</span>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; background: oklch(0.21 0.010 265); border-radius: 14px; padding: 14px;">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.3px; color: oklch(0.70 0.008 265);">SESSIONS</span>
        <span style="font-size: 22px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums;">8</span>
      </div>
    </div>

    <div style="display: flex; gap: 12px; background: oklch(0.72 0.17 65 / 0.12); border-radius: 14px; padding: 14px 16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.80 0.17 65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; line-height: 20px; font-weight: 600; color: oklch(0.86 0.10 65);">Hammer-Curls: 10 kg erreicht</span>
        <span style="font-size: 13px; line-height: 18px; color: oklch(0.78 0.06 65);">Kurzhantel-Maximum. Jetzt auf 20–25 Wdh gehen oder das Tempo verlangsamen.</span>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: flex-start; gap: 0; height: 83px; padding: 8px 8px 0 8px; background: oklch(0.19 0.009 265); border-top: 0.5px solid oklch(0.30 0.012 265); flex-shrink: 0;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 50px; padding-top: 6px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.55 0.010 265)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11v11h-11z"></path><path d="M3 9v6M21 9v6"></path></svg>
      <span style="font-size: 10px; line-height: 13px; font-weight: 500; color: oklch(0.55 0.010 265);">Heute</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 50px; padding-top: 6px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.55 0.010 265)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>
      <span style="font-size: 10px; line-height: 13px; font-weight: 500; color: oklch(0.55 0.010 265);">Woche</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 50px; padding-top: 6px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.72 0.17 145)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"></polyline><polyline points="15 7 21 7 21 13"></polyline></svg>
      <span style="font-size: 10px; line-height: 13px; font-weight: 600; color: oklch(0.72 0.17 145);">Verlauf</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 50px; padding-top: 6px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.55 0.010 265)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M5 21v-1a7 7 0 0 1 14 0v1"></path></svg>
      <span style="font-size: 10px; line-height: 13px; font-weight: 500; color: oklch(0.55 0.010 265);">Profil</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
