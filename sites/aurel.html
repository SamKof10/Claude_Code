on",title:"Sie wei\xDF, welche Uhrzeit Ihr K\xF6rper vermutet",body:"Die ARC berechnet Sonnenauf- und -untergang lokal auf dem Ger\xE4t und bewegt das Spektrum mit ihnen. Kalt und hell, wenn Sie denken m\xFCssen. Bernsteinwarm, wenn der Abend anf\xE4ngt. Passt der Standard nicht zu Ihrem Feierabend, verschieben Sie den Umschaltpunkt in der App \u2014 sonst m\xFCssen Sie nie etwas anfassen.",spec:[{label:"\xDCbergang",value:"90 min Rampe"},{label:"Aufl\xF6sung",value:"20-K-Schritte"}]},{kicker:"Spektralmaschine",title:"F\xFCnf Kan\xE4le, weil zwei nicht die Wahrheit sagen k\xF6nnen",body:"Die meisten dimmbaren Leuchten mischen ein warmes und ein kaltes Wei\xDF und nennen das Tunable White. Deshalb wird Haut grau und Holz flach. Die ARC erg\xE4nzt Amber, Tiefrot und Cyan und l\xF6st die Mischung bei jedem Schritt neu \u2014 CRI 97 \xFCber den gesamten Bereich, nicht nur an den Enden.",spec:[{label:"CRI",value:"97 (R9 > 90)"},{label:"Kan\xE4le",value:"5 unabh\xE4ngige"}]},{kicker:"Optik",title:"Licht auf dem Tisch, nicht in den Augen",body:"Eine 58 cm lange asymmetrische Linse wirft das Licht nach vorn und unten auf die Arbeitsfl\xE4che und schneidet es oberhalb von 65\xB0 hart ab. Der Schreibtisch ist gleichm\xE4\xDFig hell, auf dem Monitor spiegelt nichts, und wer Ihnen gegen\xFCbersitzt, sieht einen beleuchteten Tisch statt einer Lampe.",spec:[{label:"Abstrahlgrenze",value:"65\xB0"},{label:"Gleichm\xE4\xDFigkeit",value:"0,8 min/avg"}]},{kicker:"Das Rad",title:"Ein Bedienelement, und es tut das Naheliegende",body:"Drehen f\xFCr Helligkeit. Dr\xFCcken und drehen f\xFCr Farbtemperatur. Kurz dr\xFCcken, um den aktuellen Stand bis zum Morgen gegen den Zeitplan zu halten. Kein Men\xFC, kein Moduswechsel, kein zweiter Druck mit anderer Bedeutung \u2014 das Rad ist aus einem St\xFCck gefr\xE4st und so gewichtet, dass es sanft ausl\xE4uft.",spec:[{label:"Rastung",value:"Keine \u2014 stufenlos"},{label:"Weg",value:"270\xB0 nutzbar"}]}],reviews:[{role:"Architektin",location:"Rotterdam",title:"Der Wechsel um 21 Uhr ist der eigentliche Punkt",body:"Gekauft habe ich sie wegen der Lichtqualit\xE4t, geblieben bin ich wegen des Zeitplans. Gegen neun f\xE4llt die Leiste in etwas, das Kerzenlicht ziemlich nahekommt, und ich merke, dass ich aufh\xF6re zu blinzeln. Details zeichnen geht bei 2700 K trotzdem einwandfrei.",ownedFor:"7 Monaten"},{role:"Colorist",location:"Berlin",title:"Besteht den ColorChecker, womit ich nicht gerechnet hatte",body:"Ich messe alles gegen eine Farbkarte, bevor es in meine Suite darf. Hautt\xF6ne halten bei 5000 K, im Mittelton kippt nichts ins Gr\xFCne. Die erste Leuchte, die ich nicht filtern musste.",ownedFor:"einem Jahr"},{role:"Doktorandin",location:"Z\xFCrich",title:"Hervorragendes Licht, App nur solide",body:"Die Hardware ist wirklich sch\xF6n, und der Automatikmodus hat meinem Schlaf mehr geholfen, als ich zugeben wollte. Die App brauchte zwei Updates, bis der Zeitplan-Editor fertig wirkte. Lohnt sich, ist aber nicht makellos.",ownedFor:"5 Monaten"},{role:"Softwareentwickler",location:"Oslo",title:"Kein Flimmern in der Kamera",body:"Ich bin den halben Tag in Calls, und jede vorherige Lampe hat im Bild gestreift. Diese ist auf jeder Helligkeitsstufe sauber, offenbar wegen der DC-Dimmung. Kleinigkeit, die ein t\xE4gliches \xC4rgernis beseitigt hat.",ownedFor:"4 Monaten"},{role:"Goldschmiedin",location:"Wien",title:"Endlich sehe ich das Metall richtig",body:"Werkbankarbeit braucht ehrliche Farbe, und zwar viel davon. Bei voller Leistung deckt die ARC MAX die ganze Bank ohne Hotspot ab, und dank des hohen CRI sieht ein Stein hier so aus wie drau\xDFen.",ownedFor:"9 Monaten"},{role:"Texter",location:"Malm\xF6",title:"Sch\xF6nes Objekt, \xFCberlegte Anschaffung",body:"F\xFCr eine Schreibtischleuchte ist das viel Geld, und ich habe gez\xF6gert. Ein halbes Jahr sp\xE4ter benutze ich sie t\xE4glich und der Schreibtisch f\xFChlt sich abends anders an. Ich w\xFCrde wieder kaufen, aber ich w\xFCrde nicht so tun, als w\xE4re es g\xFCnstig.",ownedFor:"6 Monaten"}],faq:[{q:"Was kann die App?",a:"Ein- und ausschalten, ohne aufzustehen. Helligkeit und Farbtemperatur von Hand setzen. Und vor allem: festlegen, ab wann der Abendmodus greift \u2014 in 15-Minuten-Schritten zwischen 17 und 23 Uhr, f\xFCr jeden Wochentag getrennt. Dazu Presets und Firmware-Updates. Verbunden wird direkt per Bluetooth, ohne Konto und ohne Cloud."},{q:"Funktioniert sie auch ohne Handy?",a:"Vollst\xE4ndig. Ab Werk l\xE4uft die ARC ihren Sonnenverlauf \xFCber die eigene Uhr, und das Rad am Sockel \xFCberschreibt Helligkeit und Farbtemperatur jederzeit \u2014 drehen f\xFCr Helligkeit, dr\xFCcken und drehen f\xFCr Farbtemperatur. Leeres Handy, kein WLAN, App nie installiert: die Leuchte macht trotzdem, was sie soll."},{q:"Woher wei\xDF sie, wo die Sonne steht?",a:"Bei der Einrichtung geben Sie einmal einen Standort an. Danach berechnet sie Sonnenauf- und -untergang aus einer Sonnenstandstabelle direkt auf dem Ger\xE4t \u2014 ohne Netzanfrage, ohne Standortverfolgung, und \xFCber die Zeitumstellung hinweg korrekt."},{q:"Ist das wirklich besser als ein gutes Leuchtmittel?",a:"F\xFCr Raumlicht ist ein gutes Leuchtmittel v\xF6llig in Ordnung. Die ARC ist f\xFCr den einen Meter Schreibtisch vor Ihnen gebaut: CRI 97, damit Farben ehrlich bleiben, eine Optik, die das Licht auf die Arbeit legt statt in die Augen, flimmerfreies Dimmen bis 0,1 % und ein Spektrum, das sich \xFCber den Tag ver\xE4ndert. Wenn Ihnen davon nichts wichtig ist, kaufen Sie das Leuchtmittel."},{q:"Passt sie auf meinen Schreibtisch?",a:"Die ARC hat eine 58-cm-Leiste und beleuchtet rund 120 \xD7 60 cm \u2014 ein Monitor plus Tastatur. Die ARC MAX hat 84 cm f\xFCr 180 \xD7 75 cm, also einen Dual-Monitor-Aufbau. Beide klemmen an Platten bis 62 mm; ein beschwerter Standfu\xDF liegt bei. Mit dem CLIP h\xE4ngt sie am Monitor, mit dem ARCH \xFCber dem Tisch."},{q:"Was ist mit m\xFCden Augen am Abend?",a:"Genau daf\xFCr gibt es sie. Nach Sonnenuntergang geht die ARC auf 1800\u20132200 K und h\xE4lt den melanopischen Anteil niedrig, damit das Licht Ihrem K\xF6rper nicht l\xE4nger Mittag meldet. Feine Details bleiben lesbar \u2014 sie wird warm, nicht dunkel."},{q:"Wie lange h\xE4lt sie?",a:"Das LED-Array ist mit L90 bei 50.000 Stunden angegeben: nach etwa siebzehn Jahren zu acht Stunden t\xE4glich liefert es noch 90 % der urspr\xFCnglichen Leistung. Treiber, Diffusor und Rad sind einzeln tauschbar, Ersatzteile halten wir zehn Jahre vor."},{q:"Wie l\xE4uft die R\xFCckgabe?",a:"Sechzig N\xE4chte. Nutzen Sie sie an Ihrem echten Schreibtisch \xFCber einen Jahreszeitenwechsel hinweg \u2014 wenn sie nicht passt, organisieren wir die Abholung und erstatten vollst\xE4ndig, inklusive Hinversand."},{q:"Liefert ihr weltweit?",a:"Ja. Wir versenden in \xFCber 90 L\xE4nder, Versand ist im Preis enthalten. Innerhalb der EU, in die Schweiz, nach Gro\xDFbritannien und Norwegen liefern wir in zwei bis vier Werktagen; in die USA, nach Kanada, Australien und Japan in vier bis sechs. Zoll und Einfuhrumsatzsteuer sind im angezeigten Preis bereits enthalten \u2014 es kommt bei der Zustellung nichts nach. Das Netzteil liegt mit dem passenden Steckertyp f\xFCr Ihr Land bei."}],specs:[{group:"Licht",rows:[{label:"Farbtemperatur",value:"1800 \u2013 6500 K, stufenlos"},{label:"Farbwiedergabe",value:"CRI 97, R9 > 90"},{label:"Lichtstrom",value:"1100 lm (ARC) \xB7 1750 lm (ARC MAX)"},{label:"Dimmung",value:"DC, flimmerfrei, 100 % \u2013 0,1 %"},{label:"Beleuchtungsst\xE4rke auf 40 cm",value:"820 lx (ARC) \xB7 1150 lx (ARC MAX)"},{label:"Blendung",value:"UGR < 16"}]},{group:"K\xF6rper",rows:[{label:"Leistenl\xE4nge",value:"58 cm (ARC) \xB7 84 cm (ARC MAX)"},{label:"H\xF6henbereich",value:"38 \u2013 54 cm"},{label:"Material",value:"Stranggepresstes Aluminium 6063, Messinggewicht"},{label:"Oberfl\xE4che",value:"Eloxiert Typ II, glasperlgestrahlt"},{label:"Gewicht",value:"2,4 kg (ARC) \xB7 3,1 kg (ARC MAX)"},{label:"Montage",value:"Tischklemme bis 62 mm, St figurieren Sie eine Sektion weiter unten.",seeAll:"Alle Varianten ansehen"},press:[{outlet:"MONOCLE",quote:"Die erste Schreibtischleuchte, die den Schreibtisch verdient"},{outlet:"DEZEEN",quote:"Zur\xFCckhaltung als Entwurfsstrategie"},{outlet:"WALLPAPER*",quote:"Das leise bestbeleuchtete Objekt des Jahres"},{outlet:"CORE77",quote:"Technik, die man im Rad sp\xFCrt"},{outlet:"DISEGNO",quote:"Eine Leuchte, die f\xFCr Langsamkeit argumentiert"},{outlet:"IF DESIGN",quote:"Gold Award 2026 \u2014 Workspace"}],problem:{kicker:"Das Problem",title:"Ihr Abend ist auf Mittag beleuchtet.",body1:"Ihr K\xF6rper liest Licht als Uhrzeit. Kaltes, helles Licht hei\xDFt Mittag: wach bleiben, weiterarbeiten. Genau dieses Licht steht bei den meisten Menschen um elf Uhr abends noch an der Decke \u2014 und dann wundern wir uns, dass wir um eins noch wach liegen.",body2:"Das Gegenmittel ist nicht dunkler. Es ist w\xE4rmer \u2014 bei genug Licht, um noch etwas zu sehen. Nur kann das kaum eine Schreibtischleuchte, und keine tut es von allein.",evidence:[{label:"Deckenlicht um 23 Uhr",note:"Was eine \xFCbliche B\xFCrodeckenleuchte abstrahlt \u2014 dieselbe Farbtemperatur wie der Mittagshimmel."},{label:"arbeiten abends kaltwei\xDF",note:"Von 2.417 Kund:innen, die wir vor dem Kauf befragt haben."},{label:"bis zum Einschlafen",note:"Durchschnittlich berichtete Verz\xF6gerung nach zwei Stunden hellem Abendlicht."}],source:"Quelle: AUREL Kundenbefragung 2025, n = 2.417 \xB7 Werte gerundet"},solution:{kicker:"Die L\xF6sung",title:"Also haben wir den Sonnenverlauf nachgebaut.",lede:"Die ARC kennt Ihren Standort und rechnet daraus jeden Tag neu aus, wann die Sonne auf- und untergeht. Dann f\xE4hrt sie ihr Spektrum an diesem Verlauf entlang \u2014 \xFCber neunzig Minuten pro \xDCbergang, in Schritten von zwanzig Kelvin. Langsam genug, dass Sie es nicht sehen. Deutlich genug, dass Sie es merken.",chartAlt:"Farbtemperatur im Tagesverlauf",stops:["Aufwachen","Konzentration","Mittagshoch","\xDCbergang","Herunterfahren"]},productReveal:{kicker:"Das Produkt",title:"Eine Leiste, ein Rad, kein Men\xFC.",lede:"Aluminium in einem Strang gepresst, glasperlgestrahlt und eloxiert. Ein Messinggewicht im Sockel, damit nichts wandert, wenn Sie am Kabel ziehen. Sonst nichts.",currentFinish:"Aktuelle Oberfl\xE4che",configure:"Konfigurieren und kaufen",summary:"{finishes} Oberfl\xE4chen \xB7 2 L\xE4ngen \xB7 Versand in 48 Stunden"},featuresSection:{kicker:"Features",title:"Vier Entscheidungen, die den Unterschied machen.",lede:"Nichts davon ist neu erfunden. Es ist nur selten jemand bereit, alle vier gleichzeitig zu bezahlen."},smart:{kicker:"Steuerung",title:"Der Abend beginnt, wann Sie es sagen.",lede:"Ab Werk richtet sich die ARC nach dem Sonnenuntergang. Wenn Ihr Abend anders l\xE4uft, verschieben Sie den Umschaltpunkt am Handy \u2014 und schalten von dort auch einfach aus, wenn Sie schon liegen.",room:"Arbeitszimmer",on:"An",off:"Aus",tapToTurnOn:"Angetippt zum Einschalten",eveningFrom:"Abendmodus ab",earlier:"Abendmodus fr\xFCher",later:"Abendmodus sp\xE4ter",states:{off:"Aus",evening:"Abendmodus",shifting:"Wechselt",daylight:"Tageslicht"},deskAt:"Ihr Schreibtisch um {clock} Uhr",switchedOff:"Ausgeschaltet",points:[{t:"Ein und aus",d:"Vom Handy, ohne aufzustehen"},{t:"Eigener Zeitplan",d:"Umschaltpunkt in 15-Minuten-Schritten"},{t:"Ohne Konto",d:"Direkt per Bluetooth, keine Cloud"}],tryIt:"Probieren Sie es aus: Schalten Sie oben aus, oder verschieben Sie den Umschaltpunkt \u2014 die Leuchte daneben zeigt, was um halb neun auf Ihrem Schreibtisch passiert."},technology:{kicker:"Technologie",title:"Der schwierige Teil steckt im Geh\xE4use.",lede:"Ein Spektrum \xFCber den ganzen Bereich sauber zu halten ist ein Regelungsproblem, kein Designproblem. Hier ist, was daf\xFCr n\xF6tig war.",status:"Systemstatus \xB7 ARC MAX",firmware:"Firmware 4.2.1 \xB7 signiert",readouts:{colourTemp:"Farbtemperatur",illuminance:"Beleuchtungsst\xE4rke",duty:"Kanal-Duty",heatsink:"K\xFChlk\xF6rper"},spd:"Spektrale Verteilung bei {kelvin} K",cri:"CRI 97 \xB7 R9 92",pillars:[{title:"Sonnenstandstabelle an Bord",body:"Auf- und Untergang werden lokal gerechnet, aus Breitengrad und Datum. Kein Server, keine Standort\xFCbertragung, korrekt \xFCber die Zeitumstellung."},{title:"Regelkreis mit 400 Hz",body:"Jeder der f\xFCnf Kan\xE4le wird einzeln geregelt und gegen einen Referenzsensor nachgef\xFChrt \u2014 die Mischung bleibt \xFCber die Lebensdauer stabil, nicht nur am ersten Tag."},{title:"Temperaturkompensation",body:"LEDs verschieben ihre Farbe, wenn sie warm werden. Ein Sensor im K\xFChlk\xF6rper korrigiert die Mischung mit, statt die Abweichung zu ignorieren."},{title:"Bluetooth LE, Matter-ready",body:"Verbindung nur, wenn Sie sie brauchen. Die Leuchte funktioniert vollst\xE4ndig offline; die App ist ein Editor, kein Betriebssystem."}],stats:[{prefix:"",suffix:" h",label:"L90-Lebensdauer"},{prefix:"",suffix:" Jahre",label:"Garantie"},{prefix:"",suffix:" Jahre",label:"Ersatzteile"},{prefix:"CRI ",suffix:"",label:"\xFCber den ganzen Bereich"}]},variants:{kicker:"Varianten & Preis",title:"Zwei L\xE4ngen, drei Oberfl\xE4chen.",lede:"Messen Sie Ihren Schreibtisch, dann ist die Entscheidung schnell getroffen. Die Elektronik ist in beiden identisch.",chooseModel:"Modell w\xE4hlen"},accessoriesSection:{kicker:"Zubeh\xF6r",title:"Dieselbe Leuchte, woanders aufgeh\xE4ngt.",lede:"Nicht jeder Schreibtisch hat Platz f\xFCr einen Standfu\xDF, und nicht jede Arbeit will Licht von vorn. Zwei Halterungen, beide passend zu ARC und ARC MAX.",upsellTitle:"Passendes Zubeh\xF6r",upsellIn:"in {finish}",addAria:"AUREL {name} in den Warenkorb"},social:{kicker:"Kundenstimmen",title:"Zweitausend Schreibtische sp\xE4ter.",outOf:"aus {count} Bewertungen",recommend:"w\xFCrden sie empfehlen",ownedFor:"seit {duration}",trust:[{title:"60 N\xE4chte testen",note:"R\xFCckversand bezahlt"},{title:"5 Jahre Garantie",note:"Ersatzteile 10 Jahre"},{title:"Versand weltweit",note:"In 48 Stunden verschi e ab \u2014 R\xFCckversand bezahlt"},{title:"5 Jahre Garantie",note:"Ersatzteile halten wir zehn Jahre vor"}],descriptionKicker:"Produktbeschreibung",descriptionTitle:"Gebaut, um zwanzig Jahre auf demselben Tisch zu stehen.",description:["Der K\xF6rper ist ein einziges stranggepresstes Aluminiumprofil, an beiden Enden verschraubt statt verklebt. Der Diffusor l\xE4sst sich herausnehmen; sollte er in zehn Jahren stumpf sein, tauschen Sie ihn, nicht die Leuchte.","Im Sockel sitzt ein Messinggewicht von 900 Gramm. Das ist der Grund, warum die ARC stehen bleibt, wenn Sie am Kabel h\xE4ngen bleiben, und warum sie sich schwerer anf\xFChlt, als sie aussieht.","Der Rest ist Zur\xFCckhaltung: keine Statusleuchte, die nachts blinkt, kein Logo auf der Vorderseite, kein L\xFCfter. Die Leuchte soll den Schreibtisch beleuchten, nicht um Aufmerksamkeit bitten."],specsTitle:"Technische Daten"},viewer:{view:"Ansicht",views:{gesamt:"Gesamt",leiste:"Lichtleiste",sockel:"Sockel"},notes:{gesamt:"Vollansicht \xB7 {cm} cm",leiste:"Diffusor \xB7 asymmetrische Optik",sockel:"Rad \xB7 gefr\xE4st aus einem Billet"},day:"Tag \xB7 5400 K",night:"Nacht \xB7 1900 K",coverage:"{coverage} Ausleuchtung",hotspotHint:"Punkte antippen f\xFCr Details",hotspotClose:"Erneut tippen zum Schlie\xDFen",hotspots:[{title:"Asymmetrischer Diffusor",body:"Mikrostruktur im Acryl, die das Licht nach vorn kippt und oberhalb von 65\xB0 abschneidet."},{title:"Gefr\xE4stes Gelenk",body:"Reibungsgebremst, h\xE4lt jede Neigung ohne Feder und ohne Nachjustieren."},{title:"Das Rad",body:"Aus einem Billet gefr\xE4st, mit Messing beschwert. Drehen f\xFCr Helligkeit, dr\xFCcken f\xFCr Farbtemperatur."},{title:"Endkappe",body:"Verschraubt statt geklebt \u2014 der Diffusor ist entnehmbar, falls er in zehn Jahren stumpf wird."}]}};var xS={finishes:{graphite:{name:"Graphite",note:"Blasted anodised, near-black in shadow."},alabaster:{name:"Alabaster",note:"Bead-blasted, matte. Disappears against a pale wall."},sand:{name:"Sand",note:"Warm champagne anodising with a fine linear grain."}},models:{arc:{tagline:"For a desk you sit at.",highlights:["58 cm light bar","1100 lm at 4000 K","Covers one workstation"],coverage:"120 \xD7 60 cm"},"arc-max":{tagline:"For a desk you live at.",highlights:["84 cm light bar","1750 lm at 4000 K","Covers two monitors"],coverage:"180 \xD7 75 cm"}},accessories:{clip:{title:"Monitor mount",tagline:"For the desk that has no room left.",summary:"Puts the ARC on the top edge of your monitor instead of beside it. The foot rests on the panel and a counterweight holds it \u2014 no screws, no adhesive, curved displays included.",bullets:["Fits 99.9% of all monitors","Panel 6 \u2013 42 mm, curved from 1500R","Tilts \xB125\xB0, friction-damped"],specs:[{label:"Fits",value:"99.9% of all monitors, 24 \u2013 49 inch"},{label:"Clamping range",value:"6 \u2013 42 mm panel thickness"},{label:"Tilt",value:"\xB125\xB0, friction-damped"},{label:"Weight",value:"340 g incl. counterweight"},{label:"Material",value:"Aluminium, silicone pad"}]},arch:{title:"Overhead stand",tagline:"Stands on the desk, lights from above.",summary:"A cantilever arch on a weighted foot. The bar hangs 62 cm above the desktop, centred over you, and throws light straight down \u2014 no shadow from your own hand, and nothing in your eyeline.",bullets:["Reach to 48 cm, height to 74 cm","3.1 kg steel foot, won't tip","Height and reach adjustable"],specs:[{label:"Height",value:"52 \u2013 74 cm, adjustable"},{label:"Reach",value:"34 \u2013 48 cm"},{label:"Foot",value:"3.1 kg steel, felt pad"},{label:"Footprint",value:"22 cm diameter"},{label:"Material",value:"Aluminium, steel"}]}},features:[{kicker:"Solar sync",title:"It knows what time your body thinks it is",body:"The ARC computes local sunrise and sunset on device and moves the spectrum with them. Cold and bright when you need to think. Ember-warm when the evening starts. If the default doesn't match when your day ends, move the switch-over in the app \u2014 otherwise you never touch a thing.",spec:[{label:"Transition",value:"90 min ramp"},{label:"Resolution",value:"20 K steps"}]},{kicker:"Spectral engine",title:"Five channels, because two cannot tell the truth",body:"Most tunable lights mix one warm and one cool white and call it tunable white. That is why skin goes grey and wood goes flat. The ARC adds amber, deep red and cyan and re-solves the mix at every step \u2014 CRI 97 across the whole range, not only at the ends.",spec:[{label:"CRI",value:"97 (R9 > 90)"},{label:"Channels",value:"5 independent"}]},{kicker:"Optics",title:"Light on the desk, not in your eyes",body:"A 58 cm asymmetric lens throws light forward and down onto the work surface and cuts it hard above 65\xB0. The desk is evenly lit, nothing reflects off the monitor, and anyone sitting opposite sees a lit desk rather than a lamp.",spec:[{label:"Cut-off",value:"65\xB0"},{label:"Uniformity",value:"0.8 min/avg"}]},{kicker:"The dial",title:"One control, and it does the obvious thing",body:"Turn for brightness. Push and turn for colour temperature. Press to hold the current setting against the schedule until morning. No menu, no mode switch, no second press that means something else \u2014 the dial is milled from one billet and weighted so it coasts to a stop.",spec:[{label:"Detents",value:"None \u2014 continuous"},{label:"Travel",value:"270\xB0 usable"}]}],reviews:[{role:"Architect",location:"Rotterdam",title:"The 21:00 shift is the whole point",body:"I bought it for the light quality and stayed for the schedule. Around nine the bar drops into something close to candlelight and I notice I stop squinting. Drawing detail at 2700 K is still perfectly readable.",ownedFor:"7 months"},{role:"Colour grader",location:"Berlin",title:"Passes a colour checker, which I did not expect",body:"I test everything against a colour chart before it goes near my suite. Skin tones hold at 5000 K and there is no green cast in the mid-range. The first lamp I have not had to gel.",ownedFor:"a year"},{role:"PhD candidate",location:"Zurich",title:"Excellent light, app merely solid",body:"The hardware is genuinely lovely and the auto mode has helped my sleep more than I wanted to admit. The app took two updates before the schedule editor felt finished. Worth it, but not flawless.",ownedFor:"5 months"},{role:"Software engineer",location:"Oslo",title:"No flicker on camera",body:"I am on calls half the day and every previous lamp banded on camera. This one is clean at every brightness, apparently because of the DC dimming. Small thing, fixed a daily annoyance.",ownedFor:"4 months"},{role:"Goldsmith",location:"Vienna",title:"Finally see the metal properly",body:"Bench work needs honest colour and a lot of it. At full output the ARC MAX covers the whole bench with no hot spot, and thanks to the high CRI a stone looks the same here as it does outside.",ownedFor:"9 months"},{role:"Copywriter",location:"Malm\xF6",title:"Beautiful object, considered purchase",body:"It is a lot of money for a desk lamp and I hesitated. Six months on I use it every day and the desk feels different in the evening. I would buy it again, but I would not pretend it is cheap.",ownedFor:"6 months"}],faq:[{q:"What does the app do?",a:"Turns the light on and off without you getting up. Sets brightness and colour temperature by hand. And above all: decides when evening mode kicks in \u2014 in 15-minute steps between 17:00 and 23:00, separately for each weekday. Plus presets and firmware updates. It connects over Bluetooth directly, with no account and no cloud."},{q:"Does it work without a phone?",a:"Completely. Out of the box the ARC runs its solar schedule from its own clock, and the dial on the base overrides brightness and colour temperature at any time \u2014 turn for brightness, push and turn for warmth. Flat phone, no Wi-Fi, app never installed: the lamp still does its job."},{q:"How does it know where the sun is?",a:"During setup you give it a location once. From then on it computes sunrise and sunset from a solar table on the device itself \u2014 no network request, no location tracking, and correct across daylight saving changes."},{q:"Is this really better than a good bulb?",a:"For room light, a good bulb is entirely fine. The ARC is built for the metre of desk in front of you: CRI 97 so colours stay honest, optics that put the light on the work rather than in your eyes, flicker-free dimming to 0.1%, and a spectrum that changes across the day. If none of that matters to you, buy the bulb."},{q:"Will it fit my desk?",a:"The ARC has a 58 cm bar and lights roughly 120 \xD7 60 cm \u2014 one monitor plus keyboard. The ARC MAX has 84 cm for 180 \xD7 75 cm, so a dual-monitor setup. Both clamp to desks up to 62 mm, and a weighted base is included. With the CLIP it hangs on the monitor, with the ARCH above the desk."},{q:"What about tired eyes in the evening?",a:"That is exactly why it exists. After sunset the ARC drops to 1800\u20132200 K and keeps melanopic output low, so the light stops telling your body it is midday. Fine detail stays readable \u2014 it goes warm, not dark."},{q:"How long does it last?",a:"The LED array is rated L90 at 50,000 hours: after roughly seventeen years of eight-hour days it still gives 90% of its original output. Driver, diffuser and dial are individually replaceable, and we stock parts for ten years."},{q:"How do returns work?",a:"Sixty nights. Use it at your actual desk across a seasonal shift \u2014 if it is not for you, we arrange the pickup and refund in full, including the original shipping."},{q:"Do you ship worldwide?",a:"Yes. We ship to over 90 countries and shipping is included in the price. Within the EU, Switzerland, the UK and Norway we deliver in two to four working days; to the US, Canada, Australia and Japan in four to six. Duties and import VAT are already included in the price shown \u2014 nothing is charged on delivery. The power supply ships with the plug type for your country."}],specs:[{group:"Light",rows:[{label:"Colour temperature",value:"1800 \u2013 6500 K, continuous"},{label:"Colour rendering",value:"CRI 97, R9 > 90"},{label:"Output",value:"1100 lm (ARC) \xB7 1750 lm (ARC MAX)"},{label:"Dimming",value:"DC, flicker-free, 100% \u2013 0.1%"},{label:"Illuminance at 40 cm",value:"820 lx (ARC) \xB7 1150 lx (ARC MAX)"},{label:"Glare",value:"UGR < 16"}]},{group:"Body",rows:[{label:"Bar length",value:"58 cm (ARC) \xB7 84 cm (ARC MAX)"},{label:"Height range",value:"38 \u2013 54 cm"},{label:"Material",value:"Extruded 6063 aluminium, brass counterweight"},{label:"Finish",value:"Type II anodised, bead-blasted"},{label:"Weight",value:"2.4 kg (ARC) \xB7 3.1 kg (ARC MAX)"},{label:"Mounting",value:"Desk clamp to 62 mm, free-standing base included"}]},{group:"Electronics",rows:[{label:"LED array",value:"5 channels: 2 \xD7 white, amber, deep red, cyan"},{label:"Sensors",value:"Ambient lux, presence, colour temperature"},{label:"Wireless",value:"Bluetooth LE 5.3, Matter-ready"},{label:"Power",value:"24 V DC, 32 W peak, USB-C PD input"},{label:"Lifetime",value:"L90 at 50,000 hours"},{label:"Firmware",value:"Over-the-air, signed"}]},{group:"Control",rows:[{label:"App",value:"AUREL for iOS 16+ and Android 10+"},{label:"Functions",value:"On/off, brightness, colour temperature, schedule, presets"},{label:"Evening mode",value:"Free choice 17:00 \u2013 23:00, 15-minute steps, per weekday"},{label:"Connection",value:"Bluetooth LE 5.3, direct \u2014 no account, no cloud"},{label:"Range",value:"approx. 10 m, one room"},{label:"Without a phone",value:"The dial on the base sets brightness and warmth"}]},{group:"Shipping & box",rows:[{label:"Included",value:"ARC, desk clamp, base, 2 m USB-C cable, 45 W adapter"},{label:"Adapter",value:"Plug type matched to the destination"},{label:"Shipping",value:"Over 90 countries, included in the price"},{label:"Transit",value:"2 \u2013 4 working days EU/UK/CH \xB7 4 \u2013 6 worldwide"},{label:"Duties",value:"Duties and import VAT included"},{la "Time of day",now:"now",colourTemp:"Colour temperature",sunrise:"06:00 \xB7 sunrise",bedtime:"23:00 \xB7 bedtime",scrubHint:"Drag the slider through the day \u2014 this is exactly what the ARC does on its own.",scrubAria:"Choose a time of day \u2014 the lamp follows",scrubValue:"{clock}, {kelvin} Kelvin",lampAlt:"The AUREL ARC MAX, its colour temperature following the selected time of day"},shop:{kicker:"Straight to the cart",title:"Accessories, right here.",lede:"Both mounts can go in the cart now \u2014 the lamp itself is configured one section further down.",seeAll:"See all variants"},press:[{outlet:"MONOCLE",quote:"The first desk light worth the desk"},{outlet:"DEZEEN",quote:"Restraint as a design strategy"},{outlet:"WALLPAPER*",quote:"Quietly the best lit object of the year"},{outlet:"CORE77",quote:"Engineering you can feel in the dial"},{outlet:"DISEGNO",quote:"A lamp that argues for slowness"},{outlet:"IF DESIGN",quote:"Gold Award 2026 \u2014 Workspace"}],problem:{kicker:"The problem",title:"Your evening is lit like noon.",body1:"Your body reads light as a clock. Cold, bright light means midday: stay awake, keep working. That is exactly the light still on most people's ceilings at eleven at night \u2014 and then we wonder why we are lying awake at one.",body2:"The antidote is not darker. It is warmer \u2014 with enough light left to see by. Almost no desk lamp can do that, and none does it on its own.",evidence:[{label:"ceiling light at 23:00",note:"What a standard office fixture emits \u2014 the same colour temperature as a midday sky."},{label:"work under cool white at night",note:"Of 2,417 customers we surveyed before they bought."},{label:"longer to fall asleep",note:"Average reported delay after two hours of bright evening light."}],source:"Source: AUREL customer survey 2025, n = 2,417 \xB7 figures rounded"},solution:{kicker:"The solution",title:"So we rebuilt the path of the sun.",lede:"The ARC knows your location and works out, fresh each day, when the
